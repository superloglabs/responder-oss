name: Bug report
description: Report a reproducible problem in Responder
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, stop and use the private process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node, pnpm, database, browser, and deployment details that matter.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, customer data, and other private information.
      render: shell
