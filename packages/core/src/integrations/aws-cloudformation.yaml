AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Read-only AWS investigation access for Responder. With an ingest key, it also
  streams this region's CloudWatch Logs to Superlog through Amazon Data
  Firehose; Firehose and CloudWatch Logs delivery are billed to this AWS
  account. The stream uses the region's one account-level log subscription,
  so it fails where one already exists.

# Builds the log subscription policy with Fn::ToJsonString.
Transform: AWS::LanguageExtensions

Parameters:
  ResponderPrincipalArn:
    Type: String
    Description: Responder's AWS integration broker role ARN
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
  ExternalId:
    Type: String
    Description: Unique identifier for this Responder workspace and AWS account
    MinLength: 32
    MaxLength: 256
  RegistrationTopicArn:
    Type: String
    Default: ""
    Description: SNS topic that tells Responder which account ran this stack. Leave empty to connect by account ID instead.
    AllowedPattern: '^$|^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$'
  IngestUrl:
    Type: String
    Default: ""
    Description: Superlog's Firehose intake base URL, without a trailing slash. Leave empty to create only the role.
    AllowedPattern: "^$|^https://[A-Za-z0-9.-]+(:[0-9]+)?$"
  IngestKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Superlog ingest key the Firehose streams send. Leave empty to create only the role.
    AllowedPattern: "^$|^sl_ingest_[A-Za-z0-9_-]{43}$"
  ResourcePrefix:
    Type: String
    Description: Name prefix for the streaming resources.
    Default: superlog-telemetry
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,24}$"
  EnableMetrics:
    Type: String
    Description: Stream CloudWatch metrics with a metric stream.
    Default: "false"
    AllowedValues: ["true", "false"]
  EnableLogs:
    Type: String
    Description: Forward every CloudWatch Logs log group with an account-level subscription. AWS allows one per account and region; set false if this region already has one.
    Default: "true"
    AllowedValues: ["true", "false"]
  LogsFilterPattern:
    Type: String
    Description: CloudWatch Logs filter pattern. Empty forwards every event.
    Default: ""

Conditions:
  RegisterWithResponder: !Not [!Equals [!Ref RegistrationTopicArn, ""]]
  StreamTelemetry: !And
    - !Not [!Equals [!Ref IngestKey, ""]]
    - !Not [!Equals [!Ref IngestUrl, ""]]
  CreateMetrics: !And
    - !Condition StreamTelemetry
    - !Equals [!Ref EnableMetrics, "true"]
  CreateLogs: !And
    - !Condition StreamTelemetry
    - !Equals [!Ref EnableLogs, "true"]

Resources:
  InvestigationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ResponderInvestigationRole
      Description: Read-only access used by Responder incident investigations
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AIOpsAssistantPolicy
      Policies:
        - PolicyName: DenySecretValueAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenySecretValueAccess
                Effect: Deny
                Action:
                  - kms:Decrypt
                  - secretsmanager:BatchGetSecretValue
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:GetParameterHistory
                Resource: '*'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ResponderPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId

  # A custom resource's ServiceToken must be in the stack's own region, and
  # Responder's topic is in one region. This function sends the request on to
  # the topic from any region. Responder answers CloudFormation itself; the
  # function answers only when the topic cannot be reached, and on Delete,
  # which needs nothing from Responder.
  RegistrationForwarderRole:
    Type: AWS::IAM::Role
    Condition: RegisterWithResponder
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: PublishResponderRegistration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref RegistrationTopicArn

  RegistrationForwarder:
    Type: AWS::Lambda::Function
    Condition: RegisterWithResponder
    Properties:
      Description: Sends this stack's Responder registration to Responder's SNS topic
      Runtime: python3.13
      Handler: index.handler
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt RegistrationForwarderRole.Arn
      Environment:
        Variables:
          TOPIC_ARN: !Ref RegistrationTopicArn
      Code:
        ZipFile: |
          import json
          import os
          import urllib.request

          import boto3


          def respond(event, status, reason):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason,
                  "PhysicalResourceId": event.get("PhysicalResourceId") or "responder-registration",
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
              }).encode()
              request = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT", headers={"Content-Type": ""}
              )
              urllib.request.urlopen(request, timeout=10)


          def handler(event, context):
              if event["RequestType"] == "Delete":
                  respond(event, "SUCCESS", "Nothing to remove")
                  return
              topic = os.environ["TOPIC_ARN"]
              try:
                  sns = boto3.client("sns", region_name=topic.split(":")[3])
                  sns.publish(TopicArn=topic, Message=json.dumps(event))
              except Exception as error:
                  print(f"Could not reach Responder: {error}")
                  respond(event, "FAILED", "Could not reach Superlog. Start again from Superlog.")

  ResponderAccountRegistration:
    Type: Custom::ResponderRegistration
    Condition: RegisterWithResponder
    Properties:
      ServiceToken: !GetAtt RegistrationForwarder.Arn
      ExternalId: !Ref ExternalId
      RoleArn: !GetAtt InvestigationRole.Arn

  # The resources below match the telemetry stack's
  # (telemetry/sources/aws-telemetry-cloudformation.yaml) and exist only with
  # an ingest key.
  # Holds the records Firehose could not deliver, for a week.
  BackupBucket:
    Type: AWS::S3::Bucket
    Condition: StreamTelemetry
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: expire-backups
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Firehose delivery errors. The log subscription excludes this group.
  DeliveryLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: StreamTelemetry
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/${ResourcePrefix}"
      RetentionInDays: 7

  MetricsDeliveryLogStream:
    Type: AWS::Logs::LogStream
    Condition: CreateMetrics
    Properties:
      LogGroupName: !Ref DeliveryLogGroup
      LogStreamName: MetricsDelivery

  LogsDeliveryLogStream:
    Type: AWS::Logs::LogStream
    Condition: CreateLogs
    Properties:
      LogGroupName: !Ref DeliveryLogGroup
      LogStreamName: LogsDelivery

  FirehoseRole:
    Type: AWS::IAM::Role
    Condition: StreamTelemetry
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: SuperlogFirehoseDelivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BackupBucketWrite
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt BackupBucket.Arn
                  - !Sub "${BackupBucket.Arn}/*"
              - Sid: DeliveryErrorLogs
                Effect: Allow
                Action: logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/kinesisfirehose/${ResourcePrefix}:log-stream:*"

  MetricsDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Condition: CreateMetrics
    Properties:
      DeliveryStreamName: !Sub "${ResourcePrefix}-metrics"
      DeliveryStreamType: DirectPut
      HttpEndpointDestinationConfiguration:
        EndpointConfiguration:
          Name: Superlog
          Url: !Sub "${IngestUrl}/api/ingest/aws/firehose/metrics"
          AccessKey: !Ref IngestKey
        RequestConfiguration:
          ContentEncoding: GZIP
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 1
        RetryOptions:
          DurationInSeconds: 300
        S3BackupMode: FailedDataOnly
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref DeliveryLogGroup
          LogStreamName: !Ref MetricsDeliveryLogStream
        RoleARN: !GetAtt FirehoseRole.Arn
        S3Configuration:
          BucketARN: !GetAtt BackupBucket.Arn
          RoleARN: !GetAtt FirehoseRole.Arn
          Prefix: metrics/
          CompressionFormat: GZIP

  MetricStreamRole:
    Type: AWS::IAM::Role
    Condition: CreateMetrics
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: streams.metrics.cloudwatch.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: SuperlogMetricStreamToFirehose
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !GetAtt MetricsDeliveryStream.Arn

  MetricStream:
    Type: AWS::CloudWatch::MetricStream
    Condition: CreateMetrics
    Properties:
      Name: !Sub "${ResourcePrefix}-metrics"
      FirehoseArn: !GetAtt MetricsDeliveryStream.Arn
      RoleArn: !GetAtt MetricStreamRole.Arn
      OutputFormat: opentelemetry1.0
      # ECS and Container Insights have the most series; remove them to cut cost.
      IncludeFilters:
        - Namespace: AWS/EC2
        - Namespace: AWS/EBS
        - Namespace: AWS/RDS
        - Namespace: AWS/ApplicationELB
        - Namespace: AWS/NetworkELB
        - Namespace: AWS/ELB
        - Namespace: AWS/Lambda
        - Namespace: AWS/ECS
        - Namespace: ECS/ContainerInsights
        - Namespace: AWS/DynamoDB
        - Namespace: AWS/SQS
        - Namespace: AWS/SNS
        - Namespace: AWS/S3
        - Namespace: AWS/ElastiCache
        - Namespace: AWS/ApiGateway
        - Namespace: AWS/CloudFront

  LogsDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Condition: CreateLogs
    Properties:
      DeliveryStreamName: !Sub "${ResourcePrefix}-logs"
      DeliveryStreamType: DirectPut
      HttpEndpointDestinationConfiguration:
        EndpointConfiguration:
          Name: Superlog
          Url: !Sub "${IngestUrl}/api/ingest/aws/firehose/logs"
          AccessKey: !Ref IngestKey
        RequestConfiguration:
          ContentEncoding: GZIP
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 1
        RetryOptions:
          DurationInSeconds: 300
        S3BackupMode: FailedDataOnly
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref DeliveryLogGroup
          LogStreamName: !Ref LogsDeliveryLogStream
        RoleARN: !GetAtt FirehoseRole.Arn
        S3Configuration:
          BucketARN: !GetAtt BackupBucket.Arn
          RoleARN: !GetAtt FirehoseRole.Arn
          Prefix: logs/
          CompressionFormat: GZIP

  LogsToFirehoseRole:
    Type: AWS::IAM::Role
    Condition: CreateLogs
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: SuperlogLogsToFirehose
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !GetAtt LogsDeliveryStream.Arn

  # One account-level subscription covers every log group in the region,
  # current and future, except the Firehose delivery errors. AWS allows one
  # account-level subscription filter policy per account and region, so this
  # resource fails if the region already has one, such as from another
  # Superlog stack. Deploy with EnableLogs=false instead. Remove the existing
  # policy only after checking that no other stack forwards logs with it.
  LogsSubscription:
    Type: AWS::Logs::AccountPolicy
    Condition: CreateLogs
    Properties:
      PolicyName: !Sub "${ResourcePrefix}-logs"
      PolicyType: SUBSCRIPTION_FILTER_POLICY
      Scope: ALL
      SelectionCriteria: !Sub 'LogGroupName NOT IN ["/aws/kinesisfirehose/${ResourcePrefix}"]'
      PolicyDocument:
        Fn::ToJsonString:
          DestinationArn: !GetAtt LogsDeliveryStream.Arn
          RoleArn: !GetAtt LogsToFirehoseRole.Arn
          FilterPattern: !Ref LogsFilterPattern
          Distribution: Random

Outputs:
  RoleArn:
    Description: Role Responder assumes for investigations
    Value: !GetAtt InvestigationRole.Arn
  PermissionPolicy:
    Description: AWS-managed read-only investigation policy
    Value: AIOpsAssistantPolicy
  MetricStreamArn:
    Condition: CreateMetrics
    Value: !GetAtt MetricStream.Arn
  LogsDeliveryStreamArn:
    Condition: CreateLogs
    Value: !GetAtt LogsDeliveryStream.Arn
