AWSTemplateFormatVersion: "2010-09-09"
Description: Read-only AWS investigation access for Responder, and an optional role that lets Superlog manage CloudWatch Logs subscriptions to its log destinations
Parameters:
  ResponderPrincipalArn:
    Type: String
    Description: Responder's AWS integration broker role ARN
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
  ExternalId:
    Type: String
    Description: Unique identifier for this Responder workspace and AWS account
    MinLength: 32
    MaxLength: 256
  RegistrationTopicArn:
    Type: String
    Default: ""
    Description: SNS topic that tells Responder which account ran this stack. Leave empty to connect by account ID instead.
    AllowedPattern: '^$|^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$'
  LogSubscriptionPrincipalArn:
    Type: String
    Default: ""
    Description: Superlog's log subscription broker role ARN. Leave empty to create only the read-only role.
    AllowedPattern: '^$|^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
Conditions:
  RegisterWithResponder: !Not [!Equals [!Ref RegistrationTopicArn, ""]]
  ManageLogSubscriptions: !Not [!Equals [!Ref LogSubscriptionPrincipalArn, ""]]
Resources:
  InvestigationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ResponderInvestigationRole
      Description: Read-only access used by Responder incident investigations
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AIOpsAssistantPolicy
      Policies:
        - PolicyName: DenySecretValueAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenySecretValueAccess
                Effect: Deny
                Action:
                  - kms:Decrypt
                  - secretsmanager:BatchGetSecretValue
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:GetParameterHistory
                Resource: '*'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ResponderPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
  # Lets Superlog create, change, and delete account-level CloudWatch Logs
  # subscription policies, so it can stream chosen regions' error lines to
  # its log destinations. CloudWatch Logs also requires a type-specific
  # permission for every other account policy type (data protection,
  # transformers, field indexes, retention), so this role cannot change those,
  # and it reads no log data. CloudWatch Logs checks the subscription-filter
  # permission of an account policy against the account, not a log group, so
  # the deny leaves the role unable to add or remove any log group's own
  # subscription filters.
  LogSubscriptionRole:
    Type: AWS::IAM::Role
    Condition: ManageLogSubscriptions
    Properties:
      RoleName: ResponderLogSubscriptionRole
      Description: Lets Superlog manage CloudWatch Logs subscription policies to its log destinations
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: ManageLogSubscriptions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageLogSubscriptions
                Effect: Allow
                Action:
                  - logs:PutAccountPolicy
                  - logs:PutSubscriptionFilter
                  - logs:DeleteAccountPolicy
                  - logs:DeleteSubscriptionFilter
                Resource: '*'
              - Sid: DenyLogGroupSubscriptionFilters
                Effect: Deny
                Action:
                  - logs:PutSubscriptionFilter
                  - logs:DeleteSubscriptionFilter
                Resource: arn:aws:logs:*:*:log-group:*
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref LogSubscriptionPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
  ResponderRegistration:
    Type: Custom::ResponderRegistration
    Condition: RegisterWithResponder
    DependsOn: InvestigationRole
    Properties:
      ServiceToken: !Ref RegistrationTopicArn
      ExternalId: !Ref ExternalId
      RoleArn: !GetAtt InvestigationRole.Arn
Outputs:
  RoleArn:
    Description: Role Responder assumes for investigations
    Value: !GetAtt InvestigationRole.Arn
  PermissionPolicy:
    Description: AWS-managed read-only investigation policy
    Value: AIOpsAssistantPolicy
  LogSubscriptionRoleArn:
    Condition: ManageLogSubscriptions
    Description: Role Superlog assumes to manage CloudWatch Logs subscriptions
    Value: !GetAtt LogSubscriptionRole.Arn
