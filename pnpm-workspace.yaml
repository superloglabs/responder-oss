packages:
  - apps/*
  - packages/*

allowBuilds:
  '@sentry/cli': true
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

blockExoticSubdeps: true
minimumReleaseAge: 1440

overrides:
  '@daytona/sdk>shell-quote': 1.9.0
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  '@eslint/eslintrc>js-yaml': 4.3.1
  'ajv>fast-uri': 3.1.5
  'concurrently>shell-quote': 1.9.0
  'drizzle-kit>esbuild': 0.28.2
  'minimatch@3>brace-expansion': 1.1.18
  'minimatch@10>brace-expansion': 5.0.9

peerDependencyRules:
  allowedVersions:
    '@daytonaio/sdk': 0.203.0
    '@vercel/sandbox': 3.3.0

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

minimumReleaseAgeExclude:
  # Superlog's own browser SDK, released with the application.
  - '@superlog/browser@0.2.0'
  - '@superlog/react@0.2.0'
  - '@posthog/core@1.48.0'
  - '@posthog/types@1.403.1'
  - posthog-js@1.416.1
  # Better Auth security release from 2026-11-03.
  - '@better-auth/core@1.7.16'
  - '@better-auth/drizzle-adapter@1.7.16'
  - '@better-auth/kysely-adapter@1.7.16'
  - '@better-auth/memory-adapter@1.7.16'
  - '@better-auth/mongo-adapter@1.7.16'
  - '@better-auth/oauth-provider@1.7.16'
  - '@better-auth/prisma-adapter@1.7.16'
  - '@better-auth/telemetry@1.7.16'
  - auth@1.7.16
  - better-auth@1.7.16
  - better-call@1.4.5

patchedDependencies:
  '@openai/agents-openai@0.14.2': patches/@openai__agents-openai@0.14.2.patch
  pg-boss@12.26.3: patches/pg-boss@12.26.3.patch
